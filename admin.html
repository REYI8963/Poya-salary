<!DOCTYPE html>
<html lang="zh-TW" style="background:#fdf4f8">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POYA 寶雅 管理後台</title>
<style>
  :root {
    color-scheme:light;
    --pink:#e8317a; --pink-d:#c0185f; --pink-l:#fde8f1; --pink-ll:#fff5f9;
    --orange:#f47920; --green:#3aaa35; --yellow:#ffe066;
    --bg:#fdf4f8; --border:#f0d0df; --text:#2a1520; --sub:#9a6878;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Helvetica Neue',sans-serif; background:var(--bg) !important; color:var(--text); min-height:100vh; color-scheme:light only; }

  /* LOGIN */
  #login-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; background:linear-gradient(160deg,var(--pink-d) 0%,var(--pink) 55%,#f06090 100%); }
  .login-poya { font-size:38px; font-weight:900; letter-spacing:3px; color:white; text-align:center; }
  .login-tagline { color:rgba(255,255,255,0.75); font-size:12px; letter-spacing:4px; margin-top:6px; text-align:center; margin-bottom:36px; }
  .login-card { background:white; border-radius:24px; padding:30px 24px; width:100%; max-width:340px; box-shadow:0 12px 48px rgba(200,24,95,0.25); }
  .login-card h2 { font-size:16px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .login-card p { font-size:12px; color:var(--sub); margin-bottom:20px; }
  .login-card input { width:100%; padding:13px 14px; border:2px solid var(--border); border-radius:12px; font-size:16px; color:var(--text); background:var(--pink-ll); -webkit-appearance:none; margin-bottom:12px; }
  .login-card input:focus { outline:none; border-color:var(--pink); background:white; }
  .btn-login-admin { width:100%; padding:15px; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; color:white; background:linear-gradient(135deg,var(--pink),var(--pink-d)); }
  .login-error { color:var(--pink-d); font-size:13px; text-align:center; margin-top:10px; display:none; font-weight:600; }

  /* APP */
  #app-screen { display:none; }
  .color-stripe { height:4px; display:flex; }
  .color-stripe div { flex:1; }
  header { background:var(--pink); color:white; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(200,24,95,0.3); }
  .header-brand { font-size:17px; font-weight:900; }
  .header-sub { font-size:10px; opacity:0.75; display:block; }
  .btn-logout { background:rgba(255,255,255,0.2); border:none; color:rgba(255,255,255,0.85); font-size:11px; padding:5px 10px; border-radius:8px; cursor:pointer; }

  .tabs { display:flex; background:white; border-bottom:2px solid var(--border); position:sticky; top:53px; z-index:99; overflow-x:auto; }
  .tab { flex:0 0 auto; padding:11px 12px; text-align:center; font-size:11px; color:var(--sub); cursor:pointer; border-bottom:3px solid transparent; font-weight:600; margin-bottom:-2px; white-space:nowrap; }
  .tab.on { color:var(--pink); border-color:var(--pink); }

  .page { display:none; padding:14px; max-width:700px; margin:0 auto; }
  .page.on { display:block; }

  .card { background:white; border-radius:16px; padding:18px; margin-bottom:12px; box-shadow:0 2px 10px rgba(200,24,95,0.07); border:1px solid var(--border); }
  .card-title { font-size:11px; font-weight:700; color:var(--pink); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--pink-l); display:flex; align-items:center; gap:6px; }
  .card-title::before { content:''; display:block; width:3px; height:14px; background:var(--pink); border-radius:2px; }

  .fg { margin-bottom:12px; }
  .fg:last-child { margin-bottom:0; }
  label { display:block; font-size:12px; color:var(--sub); margin-bottom:5px; font-weight:600; }
  input[type="text"], input[type="password"], input[type="number"], select {
    width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px;
    font-size:15px; color:var(--text); background:var(--pink-ll); -webkit-appearance:none;
  }
  input:focus, select:focus { outline:none; border-color:var(--pink); background:white; }

  .btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:8px; }
  .btn:last-child { margin-bottom:0; }
  .btn-primary { background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:white; }
  .btn-green { background:linear-gradient(135deg,var(--green),#2d8a2a); color:white; }
  .btn-orange { background:linear-gradient(135deg,var(--orange),#d45f00); color:white; }
  .btn-outline { background:white; color:var(--pink); border:2px solid var(--pink); }
  .btn-sm { padding:7px 14px; border:none; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; }
  .btn-sm-edit { background:var(--pink-l); color:var(--pink); }
  .btn-sm-del { background:#fde8e8; color:#e74c3c; }

  /* 月份導覽 */
  .month-nav { display:flex; align-items:center; gap:8px; }
  .nav-btn { background:none; border:1.5px solid var(--border); border-radius:8px; padding:7px 14px; font-size:14px; color:var(--pink); cursor:pointer; font-weight:700; }
  .month-label { font-size:15px; font-weight:700; flex:1; text-align:center; color:var(--text); }

  /* 統計卡 */
  .stats-row { display:flex; gap:8px; margin-bottom:12px; }
  .stat-box { flex:1; background:white; border-radius:14px; padding:14px 10px; text-align:center; border:1px solid var(--border); }
  .stat-num { font-size:22px; font-weight:900; }
  .stat-lbl { font-size:10px; color:var(--sub); margin-top:3px; font-weight:600; }

  /* 司機薪資卡 */
  .driver-cards { display:grid; gap:10px; }
  .driver-card { background:white; border-radius:14px; padding:16px; border:1px solid var(--border); border-left:4px solid var(--pink); cursor:pointer; transition:box-shadow 0.15s; }
  .driver-card:active { box-shadow:0 4px 16px rgba(200,24,95,0.2); }
  .driver-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .driver-name { font-size:15px; font-weight:700; }
  .driver-total { text-align:right; }
  .driver-salary { font-size:18px; font-weight:900; color:var(--pink); }
  .driver-base { font-size:11px; color:var(--sub); }
  .driver-row { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px solid var(--pink-l); }
  .driver-row:last-child { border:none; }
  .driver-row .lbl { color:var(--sub); }
  .driver-row .val { font-weight:600; }

  /* 帳號管理 */
  .account-item { background:white; border-radius:12px; padding:14px 16px; border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .account-info { display:flex; align-items:center; gap:12px; }
  .account-avatar { width:40px; height:40px; border-radius:50%; background:var(--pink-l); color:var(--pink); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .account-name { font-size:15px; font-weight:700; }
  .account-pw { font-size:12px; color:var(--sub); margin-top:2px; }
  .account-actions { display:flex; gap:6px; }

  /* 月曆 */
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-dow { text-align:center; font-size:10px; font-weight:700; color:var(--sub); padding:4px 0; }
  .cal-dow:first-child,.cal-dow:last-child { color:#e74c3c; }
  .cal-day { background:white; border:1px solid var(--border); border-radius:8px; padding:4px 3px; min-height:48px; cursor:pointer; }
  .cal-day.empty-day { background:transparent; border:none; cursor:default; }
  .cal-day.sunday { background:#fff0f0; }
  .cal-day.today { border-color:var(--pink); border-width:2px; }
  .cal-day.has-record { background:var(--pink-ll); border-color:var(--pink); }
  .cal-day-num { font-size:11px; font-weight:600; color:var(--text); }
  .cal-day.sunday .cal-day-num { color:#e74c3c; }
  .cal-trip { font-size:9px; color:var(--pink); font-weight:700; margin-top:2px; }

  /* 薪資設定 */
  .rate-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rate-item { background:var(--pink-ll); border-radius:10px; padding:12px; border:1px solid var(--border); }
  .rate-label { font-size:11px; color:var(--sub); font-weight:600; margin-bottom:6px; }
  .rate-input { width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; font-weight:700; color:var(--pink); background:white; text-align:center; }

  /* Modal */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
  .modal-bg.show { display:flex; }
  .modal { background:white; border-radius:20px; padding:24px; width:100%; max-width:420px; margin:auto; }
  .modal h3 { font-size:16px; font-weight:700; color:var(--text); margin-bottom:16px; }
  .modal .fg { margin-bottom:10px; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .modal-actions button { flex:1; padding:14px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-modal-save { background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:white; }
  .btn-modal-cancel { background:var(--bg); color:var(--text); border:1.5px solid var(--border) !important; }

  /* 詳細紀錄 */
  .detail-record { background:var(--pink-ll); border-radius:10px; padding:12px; margin-bottom:8px; border:1px solid var(--border); }
  .detail-name { font-size:13px; font-weight:700; color:var(--pink); margin-bottom:6px; }
  .detail-row { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
  .detail-row .lbl { color:var(--sub); }
  .detail-row .val { font-weight:600; }

  .empty { text-align:center; color:#d0a0b4; padding:40px 20px; font-size:14px; }
  .loading { text-align:center; color:var(--sub); padding:30px; font-size:14px; }
  .toast { display:none; position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--text); color:white; padding:11px 22px; border-radius:22px; font-size:13px; z-index:999; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,0.2); }

  /* 篩選 */
  .filter-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .filter-chip { padding:6px 14px; border:1.5px solid var(--border); border-radius:20px; font-size:12px; font-weight:600; background:white; color:var(--sub); cursor:pointer; }
  .filter-chip.on { border-color:var(--pink); background:var(--pink-ll); color:var(--pink); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-poya">POYA 寶雅</div>
  <div class="login-tagline">ADMIN · 管理後台</div>
  <div class="login-card">
    <h2>🔐 管理員登入</h2>
    <p>請輸入管理員密碼</p>
    <input type="password" id="admin-pw" placeholder="請輸入密碼">
    <button class="btn-login-admin" onclick="adminLogin()">進入後台 →</button>
    <div class="login-error" id="login-error">❌ 密碼錯誤</div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="color-stripe">
    <div style="background:var(--pink)"></div><div style="background:var(--orange)"></div>
    <div style="background:var(--yellow)"></div><div style="background:var(--green)"></div>
  </div>
  <header>
    <div><div class="header-brand">POYA 寶雅 管理後台</div><span class="header-sub">運務管理系統</span></div>
    <button class="btn-logout" onclick="adminLogout()">登出</button>
  </header>
  <div class="tabs">
    <div class="tab on" onclick="showTab('accounts',this)">👤 帳號管理</div>
    <div class="tab" onclick="showTab('salary',this)">💰 薪資概況</div>
    <div class="tab" onclick="showTab('calendar',this)">📅 出勤月曆</div>
    <div class="tab" onclick="showTab('rates',this)">⚙️ 薪資設定</div>
  </div>

  <!-- 帳號管理 -->
  <div class="page on" id="page-accounts">
    <div class="card">
      <div class="card-title">管理員設定</div>
      <div class="fg"><label>修改管理員密碼</label>
        <input type="password" id="new-admin-pw" placeholder="輸入新密碼">
      </div>
      <button class="btn btn-outline" onclick="changeAdminPw()">🔑 更新管理員密碼</button>
    </div>
    <div class="card">
      <div class="card-title">運務士帳號</div>
      <div id="account-list"></div>
      <button class="btn btn-green" style="margin-top:12px" onclick="openAddModal()">➕ 新增運務士</button>
    </div>
  </div>

  <!-- 薪資概況 -->
  <div class="page" id="page-salary">
    <div class="card">
      <div class="card-title">選擇月份</div>
      <div class="month-nav">
        <button class="nav-btn" onclick="salaryMonthPrev()">‹</button>
        <div class="month-label" id="salary-month-label"></div>
        <button class="nav-btn" onclick="salaryMonthNext()">›</button>
      </div>
      <div class="filter-chips" id="driver-filter-chips">
        <div class="filter-chip on" onclick="setDriverFilter('')" data-name="">全部司機</div>
      </div>
    </div>
    <div id="salary-stats"></div>
    <div id="salary-content"><div class="empty">請稍候載入...</div></div>
  </div>

  <!-- 出勤月曆 -->
  <div class="page" id="page-calendar">
    <div class="card">
      <div class="card-title">出勤月曆</div>
      <div class="cal-header">
        <button class="nav-btn" onclick="calPrev()">‹</button>
        <div class="month-label" id="cal-month-label"></div>
        <button class="nav-btn" onclick="calNext()">›</button>
      </div>
      <div id="cal-summary" style="margin-bottom:10px"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div id="cal-detail"></div>
  </div>

  <!-- 薪資設定 -->
  <div class="page" id="page-rates">
    <div class="card">
      <div class="card-title">底薪設定</div>
      <div class="fg"><label>預設底薪（所有司機）</label>
        <input type="number" id="rate-base" placeholder="20000">
      </div>
      <div id="driver-base-list"></div>
    </div>
    <div class="card">
      <div class="card-title">路線趟次金額</div>
      <div class="rate-grid" id="rate-grid"></div>
    </div>
    <button class="btn btn-primary" onclick="saveRates()">💾 儲存所有設定</button>
  </div>
</div>

<!-- 帳號 Modal -->
<div class="modal-bg" id="account-modal">
  <div class="modal">
    <h3 id="modal-title">➕ 新增運務士</h3>
    <input type="hidden" id="modal-mode">
    <input type="hidden" id="modal-old-name">
    <div class="fg"><label>姓名</label><input type="text" id="modal-name" placeholder="請輸入姓名"></div>
    <div class="fg"><label>密碼（4~6碼）</label><input type="password" id="modal-pw" placeholder="請輸入密碼" maxlength="6"></div>
    <div class="modal-actions">
      <button class="btn-modal-save" onclick="saveAccount()">💾 儲存</button>
      <button class="btn-modal-cancel" onclick="closeModal('account-modal')">取消</button>
    </div>
  </div>
</div>

<!-- 司機詳細 Modal -->
<div class="modal-bg" id="driver-detail-modal">
  <div class="modal">
    <h3 id="detail-modal-title"></h3>
    <div id="detail-modal-content"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-modal-cancel" style="width:100%" onclick="closeModal('driver-detail-modal')">關閉</button>
    </div>
  </div>
</div>

<!-- 月曆日期詳細 Modal -->
<div class="modal-bg" id="cal-detail-modal">
  <div class="modal">
    <h3 id="cal-detail-title"></h3>
    <div id="cal-detail-content"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-modal-cancel" style="width:100%" onclick="closeModal('cal-detail-modal')">關閉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz6s-FJOYLDF9Ex5YO2iUEHY_O0IwwBxclKMUsSGwjcUDIUq61iLOS1M4rLuZh2dmCN/exec';
const ROUTE_COUNT = 6;
const DRIVERS = ['李憶擇','梁世昌','劉哲維','陳勇德','王晴益'];
const RATE_LABELS = {'rate_台南':'台南路線','rate_嘉義':'嘉義路線','rate_雲林':'雲林路線','rate_高雄':'高雄路線','rate_廠提台南':'廠提台南','rate_廠提台中':'廠提台中','rate_轉倉':'轉倉'};

let adminPw = localStorage.getItem('poya_admin_pw') || 'poya2026';
let salaryYear, salaryMonth, calYear, calMonth;
let currentDriverFilter = '';
let allRecordsCache = null;
let currentSettings = {};
let summaryCache = null;

function getAccounts(){ return JSON.parse(localStorage.getItem('poya_accounts')||JSON.stringify({'李憶擇':'1116','梁世昌':'5888','劉哲維':'5566','陳勇德':'1122','王晴益':'0000'})); }
function saveAccounts(a){ localStorage.setItem('poya_accounts',JSON.stringify(a)); }

window.onload = ()=>{
  const now=new Date();
  salaryYear=now.getFullYear(); salaryMonth=now.getMonth();
  calYear=now.getFullYear(); calMonth=now.getMonth();
  updateLabels();
  document.getElementById('admin-pw').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin();});
};

function updateLabels(){
  const rS=(salaryYear-1911)+'年'+String(salaryMonth+1).padStart(2,'0')+'月';
  const rC=(calYear-1911)+'年'+String(calMonth+1).padStart(2,'0')+'月';
  document.getElementById('salary-month-label').textContent=rS;
  document.getElementById('cal-month-label').textContent=rC;
}
function salaryMonthPrev(){ salaryMonth--; if(salaryMonth<0){salaryMonth=11;salaryYear--;} updateLabels(); loadSalary(); }
function salaryMonthNext(){ salaryMonth++; if(salaryMonth>11){salaryMonth=0;salaryYear++;} updateLabels(); loadSalary(); }
function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} updateLabels(); renderCalendar(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} updateLabels(); renderCalendar(); }

function adminLogin(){
  const pw=document.getElementById('admin-pw').value;
  if(pw!==adminPw){ document.getElementById('login-error').style.display='block'; return; }
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  renderAccounts();
  loadSalary();
}
function adminLogout(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('admin-pw').value='';
}
function showTab(t,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(tab=>tab.classList.remove('on'));
  document.getElementById('page-'+t).classList.add('on'); el.classList.add('on');
  if(t==='calendar') renderCalendar();
  if(t==='rates') loadRates();
}
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='block'; setTimeout(()=>el.style.display='none',3000); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function fmt$(n){ return '$'+Number(n).toLocaleString(); }
function fmtDate(dateStr){
  const s=String(dateStr||'');
  // 處理 ISO 格式: 2026-09-30T16:00:00.000Z → 2026-09-30
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return parseInt(m[2])+'/'+parseInt(m[3]);
  // 處理 Date 物件
  if(dateStr instanceof Date) return (dateStr.getMonth()+1)+'/'+dateStr.getDate();
  return s;
}

// 取日期純字串 YYYY-MM-DD（去掉時區）
function cleanDate(dateStr){
  const s=String(dateStr||'');
  const m=s.match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:s;
}

// 修正英文日期格式 "Fri Sep 25" → "2026-09-25"
function fixDateFormat(dateStr, timeStr) {
  const s = String(dateStr || '');
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const MONTHS = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',
    Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const eng = s.match(/^[A-Za-z]+ ([A-Za-z]+) (\d+)$/);
  if (eng) {
    const submitDate = timeStr ? new Date(timeStr) : new Date();
    const y = submitDate.getFullYear();
    const mo = MONTHS[eng[1]] || '01';
    const d = String(parseInt(eng[2])).padStart(2, '0');
    return y + '-' + mo + '-' + d;
  }
  if (s.length >= 10) return s.substring(0, 10);
  return s;
}

// 修正一批資料的日期格式
function fixRecordsDates(records) {
  return (records||[]).map(r => ({...r, date: fixDateFormat(r.date, r.time)}));
}

async function apiCall(data){
  const res=await fetch(API_URL,{method:'POST',body:JSON.stringify(data)});
  return await res.json();
}

// ── 管理員密碼 ──
function changeAdminPw(){
  const newPw=document.getElementById('new-admin-pw').value.trim();
  if(!newPw||newPw.length<4){ toast('⚠️ 密碼至少4碼'); return; }
  adminPw=newPw;
  localStorage.setItem('poya_admin_pw',newPw);
  document.getElementById('new-admin-pw').value='';
  toast('✅ 管理員密碼已更新！');
}

// ── 帳號管理 ──
function renderAccounts(){
  const accounts=getAccounts();
  const list=document.getElementById('account-list');
  list.innerHTML=Object.entries(accounts).map(([name,pw])=>`
    <div class="account-item">
      <div class="account-info">
        <div class="account-avatar">${name[0]}</div>
        <div><div class="account-name">${name}</div><div class="account-pw">密碼：${'●'.repeat(pw.length)}</div></div>
      </div>
      <div class="account-actions">
        <button class="btn-sm btn-sm-edit" onclick="openEditModal('${name}','${pw}')">✏️ 修改</button>
        <button class="btn-sm btn-sm-del" onclick="deleteAccount('${name}')">🗑️ 刪除</button>
      </div>
    </div>`).join('');
}
function openAddModal(){
  document.getElementById('modal-title').textContent='➕ 新增運務士';
  document.getElementById('modal-mode').value='add';
  document.getElementById('modal-old-name').value='';
  document.getElementById('modal-name').value='';
  document.getElementById('modal-pw').value='';
  document.getElementById('account-modal').classList.add('show');
}
function openEditModal(name,pw){
  document.getElementById('modal-title').textContent='✏️ 修改帳號';
  document.getElementById('modal-mode').value='edit';
  document.getElementById('modal-old-name').value=name;
  document.getElementById('modal-name').value=name;
  document.getElementById('modal-pw').value=pw;
  document.getElementById('account-modal').classList.add('show');
}
function saveAccount(){
  const mode=document.getElementById('modal-mode').value;
  const oldName=document.getElementById('modal-old-name').value;
  const name=document.getElementById('modal-name').value.trim();
  const pw=document.getElementById('modal-pw').value.trim();
  if(!name){ toast('⚠️ 請輸入姓名'); return; }
  if(!pw||pw.length<4){ toast('⚠️ 密碼至少4碼'); return; }
  const accounts=getAccounts();
  if(mode==='add'&&accounts[name]){ toast('⚠️ 姓名已存在'); return; }
  if(mode==='edit'&&oldName!==name) delete accounts[oldName];
  accounts[name]=pw;
  saveAccounts(accounts);
  closeModal('account-modal');
  renderAccounts();
  toast('✅ 已'+(mode==='add'?'新增':'更新')+' '+name);
  setTimeout(()=>toast('⚠️ 記得同步更新 index.html 的帳號設定'),3500);
}
function deleteAccount(name){
  if(!confirm(`確定刪除「${name}」？`)) return;
  const accounts=getAccounts();
  delete accounts[name];
  saveAccounts(accounts);
  renderAccounts();
  toast('🗑️ 已刪除 '+name);
}

// ── 薪資概況 ──
function setDriverFilter(name){
  currentDriverFilter=name;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('on',c.dataset.name===name));
  renderSalaryCards(summaryCache);
}

async function loadSalary(){
  document.getElementById('salary-content').innerHTML='<div class="loading">🔄 載入中...</div>';
  document.getElementById('salary-stats').innerHTML='';
  try{
    const result=await apiCall({action:'getSummary',password:adminPw,year:salaryYear,month:salaryMonth+1});
    if(result.error){ document.getElementById('salary-content').innerHTML=`<div class="empty">❌ ${result.error}</div>`; return; }
    // 修正 summary 裡每筆 record 的日期格式
    if(result.summary) {
      result.summary.forEach(d => {
        if(d.records) d.records = fixRecordsDates(d.records);
      });
    }
    summaryCache=result.summary;
    currentSettings=result.settings||{};

    // 更新篩選按鈕
    const chips=document.getElementById('driver-filter-chips');
    chips.innerHTML=`<div class="filter-chip on" onclick="setDriverFilter('')" data-name="">全部司機</div>`
      +summaryCache.map(d=>`<div class="filter-chip" onclick="setDriverFilter('${d.name}')" data-name="${d.name}">${d.name}</div>`).join('');

    // 總覽統計
    const totalSalary=summaryCache.reduce((s,d)=>s+d.salary+(d.baseSalary||0),0);
    const totalTrips=summaryCache.reduce((s,d)=>s+d.trips,0);
    document.getElementById('salary-stats').innerHTML=`
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" style="color:var(--pink)">${fmt$(totalSalary)}</div><div class="stat-lbl">本月總薪資（含底薪）</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--orange)">${totalTrips}</div><div class="stat-lbl">總趟數</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${summaryCache.length}</div><div class="stat-lbl">出勤人數</div></div>
      </div>`;
    renderSalaryCards(summaryCache);
  }catch(e){
    document.getElementById('salary-content').innerHTML='<div class="empty">❌ 連線失敗</div>';
  }
}

function renderSalaryCards(summary){
  if(!summary){ return; }
  const filtered=currentDriverFilter?summary.filter(d=>d.name===currentDriverFilter):summary;
  if(!filtered.length){ document.getElementById('salary-content').innerHTML='<div class="empty">本月尚無資料</div>'; return; }
  document.getElementById('salary-content').innerHTML=`<div class="driver-cards">${filtered.map(d=>{
    const base=d.baseSalary||0;
    const total=d.salary+base;
    const areaRows=Object.entries(d.areas||{}).filter(([k,v])=>v>0).map(([k,v])=>`
      <div class="driver-row"><span class="lbl">${k}路線</span><span class="val">${v}趟 = ${fmt$(v*(parseInt(currentSettings['rate_'+k])||0))}</span></div>`).join('');
    const facRows=Object.entries(d.factory||{}).filter(([k,v])=>v>0).map(([k,v])=>`
      <div class="driver-row"><span class="lbl">廠提${k}</span><span class="val">${v}趟 = ${fmt$(v*(parseInt(currentSettings['rate_廠提'+k])||0))}</span></div>`).join('');
    const trRow=d.transfer>0?`<div class="driver-row"><span class="lbl">轉倉</span><span class="val">${d.transfer}次 = ${fmt$(d.transfer*(parseInt(currentSettings['rate_轉倉'])||300))}</span></div>`:'';
    return `<div class="driver-card" onclick="showDriverDetail('${d.name}')">
      <div class="driver-header">
        <div class="driver-name">👤 ${d.name}</div>
        <div class="driver-total">
          <div class="driver-salary">${fmt$(total)}</div>
          <div class="driver-base">底薪 ${fmt$(base)} + 趟次 ${fmt$(d.salary)}</div>
        </div>
      </div>
      <div class="driver-row"><span class="lbl">本月趟數</span><span class="val">${d.trips} 趟</span></div>
      ${areaRows}${facRows}${trRow}
      <div style="text-align:center;margin-top:8px;font-size:11px;color:var(--sub)">點擊查看出勤紀錄 →</div>
    </div>`;
  }).join('')}</div>`;
}

function showDriverDetail(name){
  const d=summaryCache?.find(x=>x.name===name);
  if(!d) return;
  document.getElementById('detail-modal-title').textContent='📋 '+name+' 出勤紀錄';
  const records=(d.records||[]).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  document.getElementById('detail-modal-content').innerHTML=records.length===0?'<div class="empty">無紀錄</div>':records.map(r=>{
    const routes=[];
    for(let n=1;n<=ROUTE_COUNT;n++) if(r['r'+n]) routes.push(r['r'+n]+(r['a'+n]?'('+r['a'+n]+')':'')+(r['c'+n]?r['c'+n]+'間':''));
    return `<div class="detail-record">
      <div class="detail-name">📅 ${fmtDate(r.date)}</div>
      ${routes.map((rt,i)=>`<div class="detail-row"><span class="lbl">趟次${i+1}</span><span class="val">${rt}</span></div>`).join('')}
      ${r.factory&&r.factory!=='無'?`<div class="detail-row"><span class="lbl">廠提</span><span class="val">${r.factory}</span></div>`:''}
      ${r.transfer?`<div class="detail-row"><span class="lbl">轉倉</span><span class="val">${r.transfer}次</span></div>`:''}
    </div>`;
  }).join('');
  document.getElementById('driver-detail-modal').classList.add('show');
}

// ── 出勤月曆 ──
async function renderCalendar(){
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='<div class="loading" style="grid-column:span 7">🔄 載入中...</div>';
  document.getElementById('cal-summary').innerHTML='';
  document.getElementById('cal-detail').innerHTML='';

  try{
    const result=await apiCall({action:'getAllRecords',password:adminPw});
    if(result.error){ grid.innerHTML='<div class="empty" style="grid-column:span 7">❌ '+result.error+'</div>'; return; }
    // 修正日期格式
    if(result.records) result.records = fixRecordsDates(result.records);

    const prefix=String(calYear)+'-'+String(calMonth+1).padStart(2,'0');
    const records=result.records.filter(r=>{
      const d=cleanDate(String(r.date||''));
      return d.startsWith(prefix);
    });

    // 月統計
    let totalTrips=0, totalTransfer=0, totalFactory=0;
    const tonCounts={'11噸':0,'6.5噸':0,'3.5噸':0};
    records.forEach(r=>{
      for(let n=1;n<=ROUTE_COUNT;n++){
        if(r['r'+n]){ totalTrips++; const t=(r['t'+n]||'').trim(); if(tonCounts[t]!==undefined)tonCounts[t]++; }
      }
      if(r.factory&&r.factory!=='無'){ totalFactory++; const t=(r.factoryTon||'').trim(); if(tonCounts[t]!==undefined)tonCounts[t]++; }
      totalTransfer+=parseInt(r.transfer||0);
    });

    document.getElementById('cal-summary').innerHTML=`
      <div class="stats-row" style="flex-wrap:wrap">
        <div class="stat-box"><div class="stat-num" style="color:var(--pink)">${totalTrips}</div><div class="stat-lbl">本月總趟次</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--orange)">${totalTransfer}</div><div class="stat-lbl">轉倉總次</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${totalFactory}</div><div class="stat-lbl">廠提總次</div></div>
      </div>
      <div class="stats-row">
        ${Object.entries(tonCounts).map(([t,v])=>`<div class="stat-box"><div class="stat-num" style="color:var(--sub);font-size:18px">${v}</div><div class="stat-lbl">${t}</div></div>`).join('')}
      </div>`;

    // 月曆
    const firstDay=new Date(calYear,calMonth,1).getDay();
    const dim=new Date(calYear,calMonth+1,0).getDate();
    const today=new Date().toISOString().split('T')[0];

    // 整理每天的紀錄
    const dayMap={};
    records.forEach(r=>{
      const ds=cleanDate(String(r.date||''));
      if(!dayMap[ds]) dayMap[ds]=[];
      dayMap[ds].push(r);
    });

    grid.innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<firstDay;i++) grid.innerHTML+=`<div class="cal-day empty-day"></div>`;
    for(let d=1;d<=dim;d++){
      const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const recs=dayMap[ds]||[];
      const isSun=new Date(calYear,calMonth,d).getDay()===0;
      const hasRec=recs.length>0;
      const tripCount=recs.reduce((s,r)=>{let c=0;for(let n=1;n<=ROUTE_COUNT;n++){if(r['r'+n])c++;}if(r.factory&&r.factory!=='無')c++;return s+c;},0);
      grid.innerHTML+=`<div class="cal-day${isSun?' sunday':''}${ds===today?' today':''}${hasRec?' has-record':''}" onclick="${hasRec?`showCalDetail('${ds}')`:''}" style="${!hasRec?'cursor:default':''}">
        <div class="cal-day-num">${d}</div>
        ${hasRec?`<div class="cal-trip">${tripCount}趟<br>${recs.length}人</div>`:''}
      </div>`;
    }

    // 存起來供 showCalDetail 用
    window._calDayMap=dayMap;
  }catch(e){
    grid.innerHTML='<div class="empty" style="grid-column:span 7">❌ 連線失敗</div>';
  }
}

function showCalDetail(ds){
  const recs=(window._calDayMap||{})[ds]||[];
  if(!recs.length) return;
  const m=ds.match(/^(\d{4})-(\d{2})-(\d{2})/);
  const dateLabel=m?parseInt(m[2])+'/'+parseInt(m[3]):ds;
  document.getElementById('cal-detail-title').textContent='📅 '+dateLabel+' 出勤狀況（'+recs.length+'人）';

  // 當天統計
  let dayTrips=0, dayTransfer=0, dayFactory=0;
  const dayTons={'11噸':0,'6.5噸':0,'3.5噸':0};
  recs.forEach(r=>{
    for(let n=1;n<=ROUTE_COUNT;n++){
      if(r['r'+n]){ dayTrips++; const t=(r['t'+n]||'').trim(); if(dayTons[t]!==undefined)dayTons[t]++; }
    }
    if(r.factory&&r.factory!=='無'){ dayFactory++; }
    dayTransfer+=parseInt(r.transfer||0);
  });

  const statsHtml=`<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <div class="stat-box" style="flex:1"><div class="stat-num" style="font-size:20px;color:var(--pink)">${dayTrips}</div><div class="stat-lbl">趟次</div></div>
    <div class="stat-box" style="flex:1"><div class="stat-num" style="font-size:20px;color:var(--orange)">${dayTransfer}</div><div class="stat-lbl">轉倉</div></div>
    <div class="stat-box" style="flex:1"><div class="stat-num" style="font-size:20px;color:var(--green)">${dayFactory}</div><div class="stat-lbl">廠提</div></div>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
    ${Object.entries(dayTons).map(([t,v])=>v>0?`<span style="background:var(--pink-l);color:var(--pink);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700">${t}: ${v}趟</span>`:'').join('')}
  </div>`;

  document.getElementById('cal-detail-content').innerHTML=statsHtml+recs.map(r=>{
    const routes=[];
    for(let n=1;n<=ROUTE_COUNT;n++){
      if(r['r'+n]){
        let rt=r['r'+n];
        if(r['a'+n]) rt+='（'+r['a'+n]+'）';
        if(r['c'+n]) rt+=' '+r['c'+n]+'間';
        if(r['t'+n]) rt+=' ['+r['t'+n]+']';
        routes.push(rt);
      }
    }
    const fac=r.factory&&r.factory!=='無'?(r.factory+(r.factoryCount?'（'+r.factoryCount+'間）':'')+(r.factoryTon?'['+r.factoryTon+']':'')):'';
    return `<div class="detail-record">
      <div class="detail-name">👤 ${r.name}${r.plate?' · '+r.plate:''}</div>
      ${routes.map((rt,i)=>`<div class="detail-row"><span class="lbl">趟次${i+1}</span><span class="val">${rt}</span></div>`).join('')}
      ${fac?`<div class="detail-row"><span class="lbl">廠提</span><span class="val">${fac}</span></div>`:''}
      ${r.transfer?`<div class="detail-row"><span class="lbl">轉倉</span><span class="val">${r.transfer}次</span></div>`:''}
    </div>`;
  }).join('');
  document.getElementById('cal-detail-modal').classList.add('show');
}

// ── 薪資設定 ──
async function loadRates(){
  try{
    const result=await apiCall({action:'getSettings',password:adminPw});
    if(result.error){ toast('❌ '+result.error); return; }
    currentSettings=result.settings;
    const s=result.settings;

    document.getElementById('rate-base').value=s['base_salary']||20000;

    // 各司機底薪
    const accounts=getAccounts();
    document.getElementById('driver-base-list').innerHTML=`<div style="margin-top:10px"><div class="card-title" style="margin-bottom:10px">各司機個別底薪（留空則使用預設）</div><div class="rate-grid">${Object.keys(accounts).map(name=>`
      <div class="rate-item"><div class="rate-label">${name}</div>
      <input class="rate-input" type="number" id="base-${name}" placeholder="${s['base_salary']||20000}" value="${s['base_salary_'+name]||''}">
      </div>`).join('')}</div></div>`;

    // 路線費率
    document.getElementById('rate-grid').innerHTML=Object.entries(RATE_LABELS).map(([key,label])=>`
      <div class="rate-item"><div class="rate-label">${label}</div>
      <input class="rate-input" type="number" id="rate-${key}" value="${s[key]||0}">
      </div>`).join('');
  }catch(e){ toast('❌ 載入失敗'); }
}

async function saveRates(){
  const accounts=getAccounts();
  const newSettings={};
  newSettings['base_salary']=document.getElementById('rate-base').value||20000;
  Object.keys(accounts).forEach(name=>{
    const v=document.getElementById('base-'+name)?.value;
    if(v) newSettings['base_salary_'+name]=v;
    else delete newSettings['base_salary_'+name];
  });
  Object.keys(RATE_LABELS).forEach(key=>{
    const v=document.getElementById('rate-'+key)?.value;
    if(v!==undefined) newSettings[key]=v;
  });
  try{
    const result=await apiCall({action:'saveSettings',password:adminPw,settings:newSettings});
    if(result.success){ toast('✅ 設定已儲存！'); currentSettings={...currentSettings,...newSettings}; }
    else toast('❌ 儲存失敗');
  }catch(e){ toast('❌ 連線失敗'); }
}
</script>
