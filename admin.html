<!DOCTYPE html>
<html lang="zh-TW" style="background:#fdf4f8">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POYA 寶雅 管理後台</title>
<style>
  :root {
    color-scheme:light;
    --pink:#e8317a; --pink-d:#c0185f; --pink-l:#fde8f1; --pink-ll:#fff5f9;
    --orange:#f47920; --green:#3aaa35; --yellow:#ffe066;
    --bg:#fdf4f8; --border:#f0d0df; --text:#2a1520; --sub:#9a6878;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Helvetica Neue',sans-serif; background:var(--bg) !important; color:var(--text); min-height:100vh; color-scheme:light only; }

  #login-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; background:linear-gradient(160deg,var(--pink-d) 0%,var(--pink) 55%,#f06090 100%); }
  .login-poya { font-size:38px; font-weight:900; letter-spacing:3px; color:white; text-align:center; }
  .login-tagline { color:rgba(255,255,255,0.75); font-size:12px; letter-spacing:4px; margin-top:6px; text-align:center; margin-bottom:36px; }
  .login-card { background:white; border-radius:24px; padding:30px 24px; width:100%; max-width:340px; box-shadow:0 12px 48px rgba(200,24,95,0.25); }
  .login-card h2 { font-size:16px; font-weight:700; margin-bottom:4px; }
  .login-card p { font-size:12px; color:var(--sub); margin-bottom:20px; }
  .login-card input { width:100%; padding:13px 14px; border:2px solid var(--border); border-radius:12px; font-size:16px; background:var(--pink-ll); -webkit-appearance:none; margin-bottom:12px; }
  .login-card input:focus { outline:none; border-color:var(--pink); background:white; }
  .btn-login-admin { width:100%; padding:15px; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; color:white; background:linear-gradient(135deg,var(--pink),var(--pink-d)); }
  .login-error { color:var(--pink-d); font-size:13px; text-align:center; margin-top:10px; display:none; font-weight:600; }

  #app-screen { display:none; }
  .color-stripe { height:4px; display:flex; }
  .color-stripe div { flex:1; }
  header { background:var(--pink); color:white; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(200,24,95,0.3); }
  .header-brand { font-size:17px; font-weight:900; }
  .header-right { display:flex; align-items:center; gap:8px; }
  .role-badge { background:rgba(255,255,255,0.25); color:white; font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; }
  .header-sub { font-size:10px; opacity:0.75; display:block; }
  .btn-logout { background:rgba(255,255,255,0.2); border:none; color:rgba(255,255,255,0.85); font-size:11px; padding:5px 10px; border-radius:8px; cursor:pointer; }

  .tabs { display:flex; background:white; border-bottom:2px solid var(--border); position:sticky; top:53px; z-index:99; overflow-x:auto; }
  .tab { flex:0 0 auto; padding:11px 12px; font-size:11px; color:var(--sub); cursor:pointer; border-bottom:3px solid transparent; font-weight:600; margin-bottom:-2px; white-space:nowrap; }
  .tab.on { color:var(--pink); border-color:var(--pink); }

  .page { display:none; padding:14px; max-width:700px; margin:0 auto; }
  .page.on { display:block; }

  .card { background:white; border-radius:16px; padding:18px; margin-bottom:12px; box-shadow:0 2px 10px rgba(200,24,95,0.07); border:1px solid var(--border); }
  .card-title { font-size:11px; font-weight:700; color:var(--pink); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--pink-l); display:flex; align-items:center; gap:6px; }
  .card-title::before { content:''; display:block; width:3px; height:14px; background:var(--pink); border-radius:2px; }

  .fg { margin-bottom:12px; }
  .fg:last-child { margin-bottom:0; }
  label { display:block; font-size:12px; color:var(--sub); margin-bottom:5px; font-weight:600; }
  input[type="text"],input[type="password"],input[type="number"],select,input[type="month"] {
    width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px;
    font-size:15px; color:var(--text); background:var(--pink-ll); -webkit-appearance:none;
  }
  input:focus,select:focus { outline:none; border-color:var(--pink); background:white; }

  .btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:8px; }
  .btn:last-child { margin-bottom:0; }
  .btn-primary { background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:white; }
  .btn-green { background:linear-gradient(135deg,var(--green),#2d8a2a); color:white; }
  .btn-orange { background:linear-gradient(135deg,var(--orange),#d45f00); color:white; }
  .btn-outline { background:white; color:var(--pink); border:2px solid var(--pink); }
  .btn-sm { padding:6px 12px; border:none; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; }
  .btn-sm-edit { background:var(--pink-l); color:var(--pink); }
  .btn-sm-del { background:#fde8e8; color:#e74c3c; }

  .month-nav { display:flex; align-items:center; gap:8px; }
  .nav-btn { background:none; border:1.5px solid var(--border); border-radius:8px; padding:7px 14px; font-size:14px; color:var(--pink); cursor:pointer; font-weight:700; }
  .month-label { font-size:15px; font-weight:700; flex:1; text-align:center; }

  .stats-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .stat-box { flex:1; min-width:80px; background:white; border-radius:14px; padding:12px 8px; text-align:center; border:1px solid var(--border); }
  .stat-num { font-size:20px; font-weight:900; }
  .stat-lbl { font-size:10px; color:var(--sub); margin-top:3px; font-weight:600; }

  .driver-card { background:white; border-radius:14px; padding:16px; border:1px solid var(--border); border-left:4px solid var(--pink); cursor:pointer; margin-bottom:10px; }
  .driver-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .driver-name { font-size:15px; font-weight:700; }
  .driver-role-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; margin-left:6px; }
  .role-driver { background:#e8f5e9; color:#2e7d32; }
  .role-senior { background:#e3f2fd; color:#1565c0; }
  .driver-total { text-align:right; }
  .driver-salary { font-size:18px; font-weight:900; color:var(--pink); }
  .driver-base { font-size:11px; color:var(--sub); }
  .driver-row { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px solid var(--pink-l); }
  .driver-row:last-child { border:none; }
  .driver-row .lbl { color:var(--sub); }
  .driver-row .val { font-weight:600; }
  .deduction-row { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px solid #fde8e8; color:#e74c3c; }

  .account-item { background:white; border-radius:12px; padding:14px 16px; border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .account-info { display:flex; align-items:center; gap:12px; }
  .account-avatar { width:40px; height:40px; border-radius:50%; background:var(--pink-l); color:var(--pink); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .account-name { font-size:15px; font-weight:700; }
  .account-detail { font-size:12px; color:var(--sub); margin-top:2px; }
  .account-actions { display:flex; gap:6px; }

  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-dow { text-align:center; font-size:10px; font-weight:700; color:var(--sub); padding:4px 0; }
  .cal-dow:first-child,.cal-dow:last-child { color:#e74c3c; }
  .cal-day { background:white; border:1px solid var(--border); border-radius:8px; padding:4px 3px; min-height:48px; cursor:pointer; }
  .cal-day.empty-day { background:transparent; border:none; cursor:default; }
  .cal-day.sunday { background:#fff0f0; }
  .cal-day.today { border-color:var(--pink); border-width:2px; }
  .cal-day.has-record { background:var(--pink-ll); border-color:var(--pink); }
  .cal-day-num { font-size:11px; font-weight:600; }
  .cal-day.sunday .cal-day-num { color:#e74c3c; }
  .cal-trip { font-size:9px; color:var(--pink); font-weight:700; margin-top:2px; }

  .rate-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rate-item { background:var(--pink-ll); border-radius:10px; padding:12px; border:1px solid var(--border); }
  .rate-label { font-size:11px; color:var(--sub); font-weight:600; margin-bottom:6px; }
  .rate-input { width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; font-weight:700; color:var(--pink); background:white; text-align:center; }

  /* 扣款 */
  .deduction-item { background:white; border-radius:10px; padding:12px 14px; border:1px solid #fde8e8; border-left:3px solid #e74c3c; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .deduction-info .name { font-size:13px; font-weight:700; }
  .deduction-info .reason { font-size:12px; color:var(--sub); margin-top:2px; }
  .deduction-amount { font-size:16px; font-weight:900; color:#e74c3c; }

  .filter-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .filter-chip { padding:6px 14px; border:1.5px solid var(--border); border-radius:20px; font-size:12px; font-weight:600; background:white; color:var(--sub); cursor:pointer; }
  .filter-chip.on { border-color:var(--pink); background:var(--pink-ll); color:var(--pink); }

  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
  .modal-bg.show { display:flex; }
  .modal { background:white; border-radius:20px; padding:24px; width:100%; max-width:420px; margin:auto; }
  .modal h3 { font-size:16px; font-weight:700; margin-bottom:16px; }
  .modal .fg { margin-bottom:10px; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .modal-actions button { flex:1; padding:14px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-modal-save { background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:white; }
  .btn-modal-cancel { background:var(--bg); color:var(--text); border:1.5px solid var(--border) !important; }

  .detail-record { background:var(--pink-ll); border-radius:10px; padding:12px; margin-bottom:8px; border:1px solid var(--border); }
  .detail-name { font-size:13px; font-weight:700; color:var(--pink); margin-bottom:6px; }
  .detail-row { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
  .detail-row .lbl { color:var(--sub); }
  .detail-row .val { font-weight:600; }

  .empty { text-align:center; color:#d0a0b4; padding:40px 20px; font-size:14px; }
  .loading { text-align:center; color:var(--sub); padding:30px; font-size:14px; }
  .toast { display:none; position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--text); color:white; padding:11px 22px; border-radius:22px; font-size:13px; z-index:999; white-space:nowrap; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-poya">POYA 寶雅</div>
  <div class="login-tagline">ADMIN · 管理後台</div>
  <div class="login-card">
    <h2>🔐 管理員登入</h2>
    <p>請輸入管理員密碼</p>
    <input type="password" id="admin-pw" placeholder="請輸入密碼">
    <button class="btn-login-admin" onclick="adminLogin()">進入後台 →</button>
    <div class="login-error" id="login-error">❌ 密碼錯誤</div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="color-stripe">
    <div style="background:var(--pink)"></div><div style="background:var(--orange)"></div>
    <div style="background:var(--yellow)"></div><div style="background:var(--green)"></div>
  </div>
  <header>
    <div><div class="header-brand">POYA 寶雅 管理後台</div><span class="header-sub">運務管理系統</span></div>
    <div class="header-right">
      <span class="role-badge" id="role-badge"></span>
      <button class="btn-logout" onclick="adminLogout()">登出</button>
    </div>
  </header>
  <div class="tabs" id="main-tabs">
    <!-- 動態根據角色顯示 -->
  </div>

  <!-- 帳號管理 (管理員+幹部) -->
  <div class="page" id="page-accounts">
    <div class="card" id="admin-pw-section">
      <div class="card-title">管理員設定</div>
      <div class="fg"><label>修改管理員密碼</label><input type="password" id="new-admin-pw" placeholder="輸入新密碼"></div>
      <button class="btn btn-outline" onclick="changeAdminPw()">🔑 更新管理員密碼</button>
    </div>

    <div class="card">
      <div class="card-title">運務士帳號</div>
      <div id="account-list"></div>
      <button class="btn btn-green" style="margin-top:12px" onclick="openAddModal()">➕ 新增運務士</button>
    </div>
  </div>

  <!-- 本月收益 -->
  <div class="page on" id="page-revenue">
    <div class="card">
      <div class="card-title">選擇月份</div>
      <div class="month-nav">
        <button class="nav-btn" onclick="revenueMonthPrev()">‹</button>
        <div class="month-label" id="revenue-month-label"></div>
        <button class="nav-btn" onclick="revenueMonthNext()">›</button>
      </div>
    </div>
    <div id="revenue-total-card"></div>
    <div id="revenue-chart-card"></div>
    <div id="revenue-detail-cards"></div>
  </div>

  <!-- 運費設定 -->
  <div class="page" id="page-freight">
    <div class="card">
      <div class="card-title">路線運費（每趟）</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">地區</th>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">11噸</th>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">6.5噸</th>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">3.5噸</th>
          </tr></thead>
          <tbody id="freight-rate-body"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-title">廠提運費（每趟）</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">地區</th>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">11噸</th>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">6.5噸</th>
            <th style="padding:8px;background:var(--pink-l);border:1px solid var(--border);text-align:center">3.5噸</th>
          </tr></thead>
          <tbody id="factory-rate-body"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-title">下點費（第2間起，依噸數）</div>
      <div class="rate-grid">
        <div class="rate-item"><div class="rate-label">11噸 / 間</div><input class="rate-input" type="number" id="dropfee-11" placeholder="0"></div>
        <div class="rate-item"><div class="rate-label">6.5噸 / 間</div><input class="rate-input" type="number" id="dropfee-65" placeholder="0"></div>
        <div class="rate-item"><div class="rate-label">3.5噸 / 間</div><input class="rate-input" type="number" id="dropfee-35" placeholder="0"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">轉倉運費（每趟固定）</div>
      <div class="rate-item"><div class="rate-label">轉倉 / 趟</div><input class="rate-input" type="number" id="freight-transfer" placeholder="0"></div>
    </div>
    <button class="btn btn-primary" onclick="saveFreightSettings()">💾 儲存運費設定</button>
  </div>

  <!-- 薪資概況 (僅管理員) -->
  <div class="page" id="page-salary">
    <div class="card">
      <div class="card-title">選擇月份</div>
      <div class="month-nav">
        <button class="nav-btn" onclick="salaryMonthPrev()">‹</button>
        <div class="month-label" id="salary-month-label"></div>
        <button class="nav-btn" onclick="salaryMonthNext()">›</button>
      </div>
      <div class="filter-chips" id="driver-filter-chips">
        <div class="filter-chip on" onclick="setDriverFilter('')" data-name="">全部司機</div>
      </div>
    </div>
    <div id="salary-stats"></div>
    <div id="salary-content"><div class="empty">請稍候載入...</div></div>
  </div>

  <!-- 出勤月曆 (管理員+幹部) -->
  <div class="page" id="page-calendar">
    <div class="card">
      <div class="card-title">出勤月曆</div>
      <div class="month-nav" style="margin-bottom:12px">
        <button class="nav-btn" onclick="calPrev()">‹</button>
        <div class="month-label" id="cal-month-label"></div>
        <button class="nav-btn" onclick="calNext()">›</button>
      </div>
      <div id="cal-summary" style="margin-bottom:10px"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div id="cal-detail"></div>
  </div>

  <!-- 薪資設定+扣款+健保 (僅管理員) -->
  <div class="page" id="page-rates">
    <!-- 扣款管理 -->
    <div class="card">
      <div class="card-title">扣款管理</div>
      <div class="fg">
        <label>選擇月份</label>
        <input type="month" id="deduct-month">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <select id="deduct-driver" style="flex:1">
          <option value="">選擇司機</option>
        </select>
        <button class="btn-sm btn-sm-edit" onclick="loadDeductions()" style="white-space:nowrap;padding:8px 14px">查詢</button>
      </div>
      <div id="deduction-list"><div class="empty" style="padding:20px">請選擇月份和司機查詢</div></div>
      <button class="btn btn-orange" style="margin-top:12px" onclick="openDeductModal()">➕ 新增扣款</button>
    </div>

    <!-- 健保設定 -->
    <div class="card">
      <div class="card-title">健保自付額設定</div>
      <div class="rate-grid" id="health-grid"></div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveHealthSettings()">💾 儲存健保設定</button>
    </div>

    <!-- 底薪設定 -->
    <div class="card">
      <div class="card-title">底薪設定</div>
      <div class="fg"><label>預設底薪</label><input type="number" id="rate-base" placeholder="20000"></div>
      <div id="driver-base-list"></div>
    </div>

    <!-- 路線費率 -->
    <div class="card">
      <div class="card-title">路線趟次金額</div>
      <div class="rate-grid" id="rate-grid"></div>
    </div>
    <button class="btn btn-primary" onclick="saveRates()">💾 儲存所有費率設定</button>
  </div>
</div>

<!-- 帳號 Modal -->
<div class="modal-bg" id="account-modal">
  <div class="modal">
    <h3 id="modal-title">➕ 新增運務士</h3>
    <input type="hidden" id="modal-mode">
    <input type="hidden" id="modal-old-name">
    <div class="fg"><label>姓名</label><input type="text" id="modal-name" placeholder="請輸入姓名"></div>
    <div class="fg"><label>密碼（4~6碼）</label><input type="password" id="modal-pw" placeholder="請輸入密碼" maxlength="6"></div>
    <div class="fg"><label>角色</label>
      <select id="modal-role">
        <option value="driver">司機</option>
        <option value="senior">幹部</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-save" onclick="saveAccount()">💾 儲存</button>
      <button class="btn-modal-cancel" onclick="closeModal('account-modal')">取消</button>
    </div>
  </div>
</div>

<!-- 扣款 Modal -->
<div class="modal-bg" id="deduct-modal">
  <div class="modal">
    <h3>➕ 新增扣款</h3>
    <div class="fg"><label>司機</label>
      <select id="deduct-modal-driver"></select>
    </div>
    <div class="fg"><label>月份</label><input type="month" id="deduct-modal-month"></div>
    <div class="fg"><label>扣款金額</label><input type="number" id="deduct-amount" placeholder="例：500"></div>
    <div class="fg"><label>扣款原因</label><input type="text" id="deduct-reason" placeholder="例：遲到"></div>
    <div class="modal-actions">
      <button class="btn-modal-save" onclick="saveDeduction()">💾 確認扣款</button>
      <button class="btn-modal-cancel" onclick="closeModal('deduct-modal')">取消</button>
    </div>
  </div>
</div>

<!-- 司機詳細 Modal -->
<div class="modal-bg" id="driver-detail-modal">

async function loadRevenue() {
  document.getElementById('revenue-total-card').innerHTML='<div class="loading">🔄 載入中...</div>';
  document.getElementById('revenue-chart-card').innerHTML='';
  document.getElementById('revenue-detail-cards').innerHTML='';

    const [result, allResult] = await Promise.all([
      apiCall({action:'getFreightSummary', password:adminPw, year:revenueYear, month:revenueMonth+1}),
      apiCall({action:'getAllRecords', password:adminPw})

    if(result.error){ document.getElementById('revenue-total-card').innerHTML=`<div class="empty">❌ ${result.error}</div>`; return; }
    const s = result.summary;
    console.log('📊 summary.total:', s.total);
    console.log('📊 summary.areas:', JSON.stringify(s.areas));
    console.log('📊 settings:', JSON.stringify(result.settings).substring(0,300));
    // 存起來供點擊明細用
    const prefix = String(revenueYear)+'-'+String(revenueMonth+1).padStart(2,'0');
    window._revenueRecords = (allResult.records||[])
      .map(r=>({...r, date:fixDateFormat(r.date, r.time)}))
      .filter(r=>String(r.date||'').substring(0,7)===prefix);
    const rocYear = revenueYear-1911;
    const mLabel = rocYear+'年'+(revenueMonth+1)+'月';

    // 總收益卡
    const totalCardEl = document.getElementById('revenue-total-card');
    console.log('🎯 revenue-total-card 元素:', totalCardEl ? '存在' : '不存在！');
    console.log('🎯 page-revenue display:', document.getElementById('page-revenue')?.style.display, document.getElementById('page-revenue')?.className);
    if(totalCardEl) {
      totalCardEl.innerHTML=`
        <div class="card" style="text-align:center;background:linear-gradient(135deg,#1a1a2e,#16213e);border:none;margin-bottom:12px">
          <div style="font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:6px;font-weight:600">${mLabel} 本月總運費收益</div>
          <div style="font-size:38px;font-weight:900;color:white">${fmt$(s.total)}</div>
        </div>`;
      console.log('🎯 innerHTML 設定完成，內容長度:', totalCardEl.innerHTML.length);
    }

    // 計算各地區收益（用於圓餅圖）
    const chartData = [];
    const chartColors = [];
    const chartLabels = [];
    AREAS.forEach(a=>{
      if(s.areas[a] && s.areas[a].revenue > 0){
        chartLabels.push(a); chartData.push(s.areas[a].revenue); chartColors.push(AREA_COLORS[a]);
      }
    });
    FACTORY_AREAS.forEach(a=>{
      if(s.factory[a] && s.factory[a].revenue > 0){
        chartLabels.push(a); chartData.push(s.factory[a].revenue); chartColors.push(AREA_COLORS[a]);
      }
    });
    if(s.transfer.revenue > 0){
      chartLabels.push('轉倉'); chartData.push(s.transfer.revenue); chartColors.push(AREA_COLORS['轉倉']);
    }

    // 圓餅圖
    if(chartData.length > 0){
      document.getElementById('revenue-chart-card').innerHTML=`
        <div class="card" style="margin-bottom:12px">
          <div class="card-title">收入來源分佈</div>
          <div style="position:relative;height:260px">
            <canvas id="revenue-pie-chart"></canvas>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
            ${chartLabels.map((l,i)=>`<div style="display:flex;align-items:center;gap:5px;font-size:12px">
              <div style="width:12px;height:12px;border-radius:50%;background:${chartColors[i]}"></div>
              <span>${l}: ${fmt$(chartData[i])}</span>

          </div>
        </div>`;

      if(typeof Chart === 'undefined'){

        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';
        script.onload = ()=>drawPieChart(chartData, chartColors, chartLabels, s.total);
        document.head.appendChild(script);
      } else {
        drawPieChart(chartData, chartColors, chartLabels, s.total);

    // 明細卡片

      const color = AREA_COLORS[a];

        <div class="driver-header">

      let rows = '';

        if(!d || d.trips === 0) return;

        <div class="driver-header">
          <div class="driver-name" style="color:${color}">🏭 ${a} <span style="font-size:11px;color:var(--sub)">點擊看日期明細 ▼</span></div>
          <div class="driver-salary" style="color:${color}">${fmt$(s.factory[a].revenue)}</div>

        <div id="area-detail-${a}" style="display:none;margin-top:10px;border-top:1px solid var(--pink-l);padding-top:10px"></div>
      </div>`;
    });

      const color = AREA_COLORS['轉倉'];
      detailHtml += `<div class="driver-card" style="border-left-color:${color};margin-bottom:10px;cursor:pointer" onclick="toggleAreaDetail('area-detail-轉倉','轉倉')">
        <div class="driver-header">
          <div class="driver-name" style="color:${color}">🔄 轉倉 <span style="font-size:11px;color:var(--sub)">點擊看日期明細 ▼</span></div>
          <div class="driver-salary" style="color:${color}">${fmt$(s.transfer.revenue)}</div>
        </div>
        <div class="driver-row"><span class="lbl">共 ${s.transfer.count} 次</span><span class="val"><b style="color:${color}">${fmt$(s.transfer.revenue)}</b></span></div>
        <div id="area-detail-轉倉" style="display:none;margin-top:10px;border-top:1px solid var(--pink-l);padding-top:10px"></div>
      </div>`;
    }
    document.getElementById('revenue-detail-cards').innerHTML = detailHtml || '<div class="empty">本月尚無資料</div>';
  } catch(e) {
    document.getElementById('revenue-total-card').innerHTML='<div class="empty">❌ 連線失敗</div>';
  }
}

function toggleAreaDetail(divId, area) {
  const div = document.getElementById(divId);
  if (!div) return;
  if (div.style.display !== 'none') { div.style.display='none'; return; }
  const records = window._revenueRecords || [];
  const color = AREA_COLORS[area]||'var(--pink)';

  // 轉倉特別處理
  if(area === '轉倉') {
    const dayMap = {};
    records.forEach(r => {
      const transfer = parseInt(r.transfer||0);
      if(transfer <= 0) return;
      const ds = String(r.date||'').substring(0,10);
      if(!dayMap[ds]) dayMap[ds]=[];
      dayMap[ds].push({ name: r.name, count: transfer });
    });
    const sorted = Object.keys(dayMap).sort();
    if(!sorted.length){ div.innerHTML='<div style="color:var(--sub);font-size:13px;text-align:center">無資料</div>'; div.style.display='block'; return; }
    div.innerHTML = sorted.map(ds=>{
      const m = ds.match(/^\d{4}-(\d{2})-(\d{2})/);
      const dateLabel = m ? parseInt(m[1])+'/'+parseInt(m[2]) : ds;
      const items = dayMap[ds];
      const total = items.reduce((s,i)=>s+i.count,0);
      return `<div style="margin-bottom:8px">
        <div style="font-size:12px;font-weight:700;color:${color};margin-bottom:3px">📅 ${dateLabel}（共${total}次）</div>
        ${items.map(t=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 6px;background:var(--pink-ll);border-radius:6px;margin-bottom:2px">
          <span style="color:var(--sub)">${t.name}</span>
          <span style="font-weight:600">${t.count}次</span>
        </div>`).join('')}
      </div>`;
    }).join('');
    div.style.display='block';
    return;
  }

  const isFactory = area.startsWith('廠提');
  const factoryArea = isFactory ? area.replace('廠提','') : null;

  const dayMap = {};
  records.forEach(r => {
    if(isFactory) {
      if(r.factory !== factoryArea) return;
      const ds = String(r.date||'').substring(0,10);
      if(!dayMap[ds]) dayMap[ds]=[];
      dayMap[ds].push({
        name: r.name,
        info: r.factory+'（'+r.factoryCount+'間）['+r.factoryTon+']',
        type: 'factory'
      });
    } else {
      for(let n=1;n<=6;n++){
        if(r['r'+n] && (r['a'+n]||'').trim()===area){
          const ds = String(r.date||'').substring(0,10);
          if(!dayMap[ds]) dayMap[ds]=[];
          dayMap[ds].push({
            name: r.name,
            info: r['r'+n]+'（'+r['a'+n]+'）'+r['c'+n]+'間 ['+r['t'+n]+']',
            type: 'route'
          });
        }
      }
    }
  });

  const sorted = Object.keys(dayMap).sort();
  if(!sorted.length){ div.innerHTML='<div style="color:var(--sub);font-size:13px;text-align:center">無資料</div>'; div.style.display='block'; return; }
  // color 已在上方宣告
  div.innerHTML = sorted.map(ds=>{
    const m = ds.match(/^\d{4}-(\d{2})-(\d{2})/);
    const dateLabel = m ? parseInt(m[1])+'/'+parseInt(m[2]) : ds;
    const trips = dayMap[ds];
    return `<div style="margin-bottom:8px">
      <div style="font-size:12px;font-weight:700;color:${color};margin-bottom:3px">📅 ${dateLabel}（${trips.length}趟）</div>
      ${trips.map(t=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 6px;background:var(--pink-ll);border-radius:6px;margin-bottom:2px">
        <span style="color:var(--sub)">${t.name}</span>
        <span style="font-weight:600">${t.info}</span>
      </div>`).join('')}
    </div>`;
  }).join('');
  div.style.display='block';
}

function drawPieChart(data, colors, labels, total) {
  const ctx = document.getElementById('revenue-pie-chart');
  if(!ctx) return;
  if(ctx._chartInstance) ctx._chartInstance.destroy();
  ctx._chartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const pct = Math.round(ctx.parsed / total * 100);
              return ctx.label + ': $' + ctx.parsed.toLocaleString() + ' (' + pct + '%)';
            }
          }
        }
      }
    }
  });
}

function toast(msg) {

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function fmt$(n) { return '$'+Number(n).toLocaleString(); }

function fixDateFormat(dateStr, timeStr) {
  const s = String(dateStr||'');
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const MONTHS={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const eng=s.match(/^[A-Za-z]+ ([A-Za-z]+) (\d+)$/);
  if(eng){
    const y=(timeStr?new Date(timeStr):new Date()).getFullYear();
    const mo=MONTHS[eng[1]]||'01';
    const d=String(parseInt(eng[2])).padStart(2,'0');
    return y+'-'+mo+'-'+d;
  }
  if(s.length>=10) return s.substring(0,10);
  return s;
}
function fixRecordsDates(records) { return (records||[]).map(r=>({...r,date:fixDateFormat(r.date,r.time)})); }
function cleanDate(dateStr) { const m=String(dateStr||'').match(/^(\d{4}-\d{2}-\d{2})/); return m?m[1]:String(dateStr||''); }
function fmtDate(dateStr) { const m=String(dateStr||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?parseInt(m[2])+'/'+parseInt(m[3]):String(dateStr||''); }

}

async function renderCalendar() {
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='<div class="loading" style="grid-column:span 7">🔄 載入中...</div>';
  document.getElementById('cal-summary').innerHTML='';
  try {
    const result=await apiCall({action:'getAllRecords',password:adminPw});
    if(result.error){grid.innerHTML='<div class="empty" style="grid-column:span 7">❌ '+result.error+'</div>';return;}
    if(result.records) result.records=fixRecordsDates(result.records);

    const prefix=String(calYear)+'-'+String(calMonth+1).padStart(2,'0');
    const records=result.records.filter(r=>{
      const d=cleanDate(String(r.date||'')); return d.startsWith(prefix);
    });

    let totalTrips=0,totalTransfer=0,totalFactory=0;
    const tonCounts={'11噸':0,'6.5噸':0,'3.5噸':0};
    records.forEach(r=>{
      for(let n=1;n<=ROUTE_COUNT;n++){if(r['r'+n]){totalTrips++;const t=(r['t'+n]||'').trim();if(tonCounts[t]!==undefined)tonCounts[t]++;}}
      if(r.factory&&r.factory!=='無'){totalFactory++;const t=(r.factoryTon||'').trim();if(tonCounts[t]!==undefined)tonCounts[t]++;}
      totalTransfer+=parseInt(r.transfer||0);
    });

    document.getElementById('cal-summary').innerHTML=`
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" style="color:var(--pink)">${totalTrips}</div><div class="stat-lbl">本月總趟次</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--orange)">${totalTransfer}</div><div class="stat-lbl">轉倉</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${totalFactory}</div><div class="stat-lbl">廠提</div></div>
      </div>
      <div class="stats-row">
        ${Object.entries(tonCounts).map(([t,v])=>`<div class="stat-box"><div class="stat-num" style="color:var(--sub);font-size:16px">${v}</div><div class="stat-lbl">${t}</div></div>`).join('')}
      </div>`;

    const firstDay=new Date(calYear,calMonth,1).getDay();
    const dim=new Date(calYear,calMonth+1,0).getDate();
    const today=new Date().toISOString().split('T')[0];
    const dayMap={};
    records.forEach(r=>{const ds=cleanDate(String(r.date||''));if(!dayMap[ds])dayMap[ds]=[];dayMap[ds].push(r);});

    grid.innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<firstDay;i++) grid.innerHTML+=`<div class="cal-day empty-day"></div>`;
    for(let d=1;d<=dim;d++){
      const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const recs=dayMap[ds]||[];
      const isSun=new Date(calYear,calMonth,d).getDay()===0;
      const tripCount=recs.reduce((s,r)=>{let c=0;for(let n=1;n<=ROUTE_COUNT;n++){if(r['r'+n])c++;}if(r.factory&&r.factory!=='無')c++;return s+c;},0);
      grid.innerHTML+=`<div class="cal-day${isSun?' sunday':''}${ds===today?' today':''}${recs.length>0?' has-record':''}" onclick="${recs.length>0?`showCalDetail('${ds}')`:''}" style="${recs.length===0?'cursor:default':''}">
        <div class="cal-day-num">${d}</div>
        ${recs.length>0?`<div class="cal-trip">${tripCount}趟 ${recs.length}人</div>`:''}
      </div>`;
    }
    window._calDayMap=dayMap;
  } catch(e) {
    grid.innerHTML='<div class="empty" style="grid-column:span 7">❌ 連線失敗</div>';
  }
}

function showCalDetail(ds) {
  const recs=(window._calDayMap||{})[ds]||[];

  const m=ds.match(/^(\d{4})-(\d{2})-(\d{2})/);

  document.getElementById('cal-detail-content').innerHTML=statsHtml+recs.map(r=>{

    const fac=r.factory&&r.factory!=='無'?r.factory+(r.factoryTon?'['+r.factoryTon+']':''):'';
    return `<div class="detail-record">
      <div class="detail-name">👤 ${r.name}${r.plate?' · '+r.plate:''}</div>
      ${routes.map((rt,i)=>`<div class="detail-row"><span class="lbl">趟次${i+1}</span><span class="val">${rt}</span></div>`).join('')}
      ${fac?`<div class="detail-row"><span class="lbl">廠提</span><span class="val">${fac}</span></div>`:''}
      ${r.transfer?`<div class="detail-row"><span class="lbl">轉倉</span><span class="val">${r.transfer}次</span></div>`:''}
    </div>`;
  }).join('');
  document.getElementById('cal-detail-modal').classList.add('show');
}

        </div>
      </div>`).join('');
  } catch(e){ list.innerHTML='<div class="empty">❌ 連線失敗</div>'; }
}
async function removeDeduction(id) {
  if(!confirm('確定刪除此扣款？'))return;
  const result=await apiCall({action:'deleteDeduction',password:adminPw,id});
  if(result.success){toast('🗑️ 已刪除');loadDeductions();if(summaryCache)loadSalary();}
  else toast('❌ '+result.error);
}

// 薪資設定
async function loadRates() {
  try {
    const result=await apiCall({action:'getSettings',password:adminPw});
    if(result.error){toast('❌ '+result.error);return;}
    currentSettings=result.settings;
    const s=result.settings;
    document.getElementById('rate-base').value=s['base_salary']||20000;

    const accounts=getAccounts();
    const names=Object.keys(accounts);

    // 健保設定
    document.getElementById('health-grid').innerHTML=names.map(name=>`
      <div class="rate-item">
        <div class="rate-label">👤 ${name}</div>
        <input class="rate-input" type="number" id="health-${name}" placeholder="0" value="${s['health_'+name]||''}">
      </div>`).join('');

    // 各司機底薪
    document.getElementById('driver-base-list').innerHTML=`<div style="margin-top:10px"><div style="font-size:11px;color:var(--sub);font-weight:600;margin-bottom:8px">各司機個別底薪</div><div class="rate-grid">${names.map(name=>`
      <div class="rate-item"><div class="rate-label">${name}</div>
      <input class="rate-input" type="number" id="base-${name}" placeholder="${s['base_salary']||20000}" value="${s['base_salary_'+name]||''}">
      </div>`).join('')}</div></div>`;

    // 路線費率
    document.getElementById('rate-grid').innerHTML=Object.entries(RATE_LABELS).map(([key,label])=>`
      <div class="rate-item"><div class="rate-label">${label}</div>
      <input class="rate-input" type="number" id="rate-${key}" value="${s[key]||0}">
      </div>`).join('');
  } catch(e){ toast('❌ 載入失敗'); }
}

async function saveHealthSettings() {
  const accounts=getAccounts();
  const newSettings={};
  Object.keys(accounts).forEach(name=>{
    const v=document.getElementById('health-'+name)?.value;
    newSettings['health_'+name]=v||'0';
  });
  try {
    const result=await apiCall({action:'saveSettings',password:adminPw,settings:newSettings});
    if(result.success) toast('✅ 健保設定已儲存！');
    else toast('❌ 儲存失敗');
  } catch(e){ toast('❌ 連線失敗'); }
}

async function saveRates() {
  const accounts=getAccounts();
  const newSettings={};
  newSettings['base_salary']=document.getElementById('rate-base').value||20000;
  Object.keys(accounts).forEach(name=>{
    const v=document.getElementById('base-'+name)?.value;
    if(v) newSettings['base_salary_'+name]=v;
  });
  Object.keys(RATE_LABELS).forEach(key=>{
    const v=document.getElementById('rate-'+key)?.value;
    if(v!==undefined) newSettings[key]=v;
  });
  try {
    const result=await apiCall({action:'saveSettings',password:adminPw,settings:newSettings});
    if(result.success){toast('✅ 費率設定已儲存！');currentSettings={...currentSettings,...newSettings};}
    else toast('❌ 儲存失敗');
  } catch(e){ toast('❌ 連線失敗'); }
}
</script>
